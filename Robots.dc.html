<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/tokens/colors.css">
  <link rel="stylesheet" href="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/tokens/typography.css">
  <link rel="stylesheet" href="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/tokens/base.css">
  <link rel="stylesheet" href="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/styles.css">
  <script src="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
</helmet>
<dc-import name="NavHeader" active="robots" hint-size="100%,64px"></dc-import>
<main>
  <section style="background:var(--gm-royal-blue);color:var(--gm-white);padding:56px 24px;text-align:center">
    <h1 style="font-family:var(--font-title);font-size:clamp(28px,4vw,40px);margin:0">Our Robots</h1>
  </section>
  <section style="max-width:var(--container-max);margin:0 auto;padding:40px 24px 64px">
  <div style="display:flex;flex-direction:column;gap:28px">
    <sc-for list="{{ robots }}" as="r" hint-placeholder-count="4">
      <x-import component-from-global-scope="GreaseMonkeys457DesignSystem_65893e.Card" padding="0px" hint-size="100%,340px">
        <div style="display:grid;grid-template-columns:420px 1fr;gap:0">
          <a href="{{ r.albumUrl }}" style="display:block;width:100%;height:100%;pointer-events:{{ r.albumLinkPointerEvents }}">
            <image-slot id="{{ r.photoId }}" src="{{ r.photoUrl }}" shape="rect" placeholder="Drop a robot photo" style="width:100%;height:100%;min-height:320px"></image-slot>
          </a>
          <div style="padding:24px;display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
              <a href="{{ r.albumUrl }}" style="pointer-events:{{ r.albumLinkPointerEvents }};text-decoration:none;color:inherit;display:flex;align-items:baseline;gap:10px">
                <span style="font-family:var(--font-heading);font-weight:700;font-size:20px;color:var(--gm-black)">{{ r.year }}</span>
                <span style="font-family:var(--font-heading);font-weight:700;font-size:20px;color:var(--gm-black)">—</span>
                <h3 style="font-family:var(--font-heading);font-size:20px;margin:0">{{ r.name }}</h3>
              </a>
            </div>
            <p style="font-family:var(--font-body);font-size:14px;color:var(--text-secondary);line-height:var(--leading-body);margin:0">{{ r.result }}</p>
            <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
              <sc-for list="{{ r.awards }}" as="a" hint-placeholder-count="1">
                <x-import component-from-global-scope="GreaseMonkeys457DesignSystem_65893e.Badge" tone="success" hint-size="auto,24px">🏆 {{ a }}</x-import>
              </sc-for>
            </div>
          </div>
        </div>
      </x-import>
    </sc-for>
  </div>
  </section>
</main>
<dc-import name="SiteFooter" hint-size="100%,120px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { robots: [] };
  async componentDidMount() {
    const m = await import('./data/robots-data.js');
    this.setState({ robots: m.robots });
  }
  renderVals() {
    const robots = this.state.robots.map(r => ({ ...r, albumLinkPointerEvents: r.albumUrl ? "auto" : "none" }));
    return { robots };
  }
}

</script>
</body>
</html>
