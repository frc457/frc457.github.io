<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/tokens/colors.css">
  <link rel="stylesheet" href="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/tokens/typography.css">
  <link rel="stylesheet" href="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/tokens/base.css">
  <link rel="stylesheet" href="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/styles.css">
  <script src="_ds/grease-monkeys-457-design-system-65893e59-55b1-451b-9f29-911aecf6850e/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
</helmet>
<dc-import name="NavHeader" active="updates" hint-size="100%,64px"></dc-import>
<main>
  <section style="background:var(--gm-royal-blue);color:var(--gm-white);padding:56px 24px;text-align:center">
    <h1 style="font-family:var(--font-title);font-size:clamp(28px,4vw,40px);margin:0">This Season: REBUILT</h1>
  </section>
  <section style="max-width:var(--container-max);margin:0 auto;padding:40px 24px 64px">
  <x-import component-from-global-scope="GreaseMonkeys457DesignSystem_65893e.Badge" tone="blue" hint-size="auto,24px">2026 · REBUILT</x-import>
  <p style="font-family:var(--font-body);color:var(--text-secondary);max-width:640px;margin:12px 0 32px">Updates on the current 2026 season, REBUILT.</p>
  <div style="max-width:100%;margin:0 0 40px">
    <image-slot id="updates-hero" shape="rounded" radius="8" placeholder="Drop a current build-season photo" style="width:100%;height:320px"></image-slot>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px">
    <sc-for list="{{ updates }}" as="u" hint-placeholder-count="3">
      <x-import component-from-global-scope="GreaseMonkeys457DesignSystem_65893e.Card" padding="20px" hint-size="100%,100px">
        <div style="font-family:var(--font-heading);font-weight:700;font-size:13px;color:var(--gm-royal-blue);margin-bottom:6px">{{ u.date }}</div>
        <p style="font-family:var(--font-body);font-size:15px;line-height:var(--leading-body);margin:0">{{ u.body }}</p>
      </x-import>
    </sc-for>
  </div>
  </section>
</main>
<dc-import name="SiteFooter" hint-size="100%,120px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { updates: [] };
  async componentDidMount() {
    const m = await import('./data/updates-data.js');
    this.setState({ updates: m.updates });
  }
  renderVals() { return { updates: this.state.updates }; }
}

</script>
</body>
</html>
